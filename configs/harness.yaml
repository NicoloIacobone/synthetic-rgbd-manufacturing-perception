# Task A / Task B harness hyperparameters. NOT part of the frozen protocol.
# Fixed on the dev split by the A-45 pooled worst-case rule, identical across conditions (PLAN §5.2).
# Selection re-run after the §5.11 fix (A-62): data/m5_dev/selection_fix. Changing a value: record it in ASSUMPTIONS and DIARY.

icp:                         # synthrgbd.pose.IcpParams (A-46). SELECTED on dev 1000-1004 (A-45 pooled rule, leximin): H3
  mask_erosion_px: 2         # GT visible mask eroded before back-projection (A-07)
  max_corr_mm: 15.0          # unused when stages is set
  tukey_k_mm: 5.0            # unused when stages is set
  stages: [[20, 20], [10, 10], [5, 5]]   # coarse-to-fine (max correspondence mm, Tukey scale mm)
  visibility: raycast        # model points that are the first hit from the camera (self-occlusion)
  o3d_step_clamp: true       # H3: single iterations clamped to 5 mm / 5 deg; won the leximin rule after the §5.11 fix (A-62), by one dev view on C3
  outer_iters: 5             # back-face culling refreshes
  inner_iters: 30
  min_points: 30             # fewer valid scene points -> no estimate (counted as failure)

model_sampling:
  points_per_model: 200000   # area-uniform CAD samples with CAD normals. 200000 from 2026-11-05 (A-62, ledger): the drift left
                             #   on ideal depth was bounded by about one sample spacing; 0.80 -> 0.40 mm on the 150 mm profile.
                             #   Before: 6000 gave 0.07-0.10 mm zero-offset drift on ideal ray-cast views (sparse targets),
                             #   60000 gave 0.006-0.019 mm (M4 step 1, unit tests)
  seed: 0                    # harness constant (not a §5.10 stream): same model samples everywhere

instances:
  min_visib_fract: 0.1       # BOP convention, verified (A-49); PLAN 5.12 row 2026-11-04

suction:                     # synthrgbd.suction.SuctionParams (PLAN §5.3; cup + thresholds frozen in default.yaml)
  mask_erosion_px: 2
  candidate_voxel_mm: 2.0    # candidate grasp centres: one measured point per 2 mm voxel
  rim_samples: 32            # the cup "fits" if each of 32 rim points (radius r, fitted plane) has a measured point
  rim_gap_mm: 1.5            #   within 1.5 mm. Sector coverage (8 sectors in [0.7 r, r]) let the disk overhang a bracket
                             #   edge by 0.83 mm on an ideal view; 16 sectors in [0.9 r, r] found no fit on tilted dev faces
                             #   (sparse pixels). 1.5 mm < the 2 px erosion margin (~1.6 mm at 0.8 m). Set on synthetic
                             #   geometry and sampling density, not outcomes (A-45)
  min_neighbours: 20
  grasp_point: plane_fit     # raw | plane_fit (A-44: chosen on dev by the A-45 rule)
