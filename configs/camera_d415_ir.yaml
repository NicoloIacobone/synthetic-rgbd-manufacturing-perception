# Active-stereo camera model (D13, D15; milestone M3). NOT part of the frozen protocol.
# Geometry (resolution, HFOV, baseline, 126 px search range, Min-Z) is read from configs/default.yaml;
# this file holds the projector, dot pattern, IR rendering, exposure and matcher settings.
# Changing a value here is a camera-model change: record it in docs/ASSUMPTIONS.md and docs/DIARY.md.

projector:
  fov_deg: [67.0, 41.0]        # H x V field of projection (A-36, S-01 Tables 3-11/3-48)
  position_x_m: 0.0275         # in the left-imager frame, between the imagers: baseline midpoint (A-41)
  power_w: 1.0                 # Blender spot power; absolute scale is irrelevant, exposure.gain sets DN

dots:                          # A-37 (D415 pattern not published)
  count: 30000                 # over the whole 67 x 41 deg field
  seed: 415                    # camera constant: one fixed pattern for all frames (not a §5.10 stream)
  min_spacing_frac: 0.6        # Poisson-disk (dart throwing) minimum distance / mean spacing
  sigma_cam_px: 0.7            # Gaussian dot sigma, in left-camera pixels (set at M3, A-37)
  oversample: 2.0              # pattern texels per left-camera pixel (pattern focal = 2 f)

ir_render:
  samples: 32                  # Cycles samples per IR image, no adaptive sampling, no denoiser
  pad_px: 128                  # both IR images rendered 128 px wider on the left (cx + 128), A-40
  clamp: 0.0                   # Cycles direct/indirect sample clamping off (no hidden saturation, A-32 ii)
  ambient: 0.0                 # world background in the IR passes: projector only (A-03, A-42); ambient_test below is descriptive
  storage: float16             # linear radiance, unclipped (A-32); npz per frame
  glossy_bounces: 3            # BlenderProc's default 0 removes every reflected image from metal (A-57, bug found at M5)
  max_bounces: 12              # Cycles default; ledger rule (A-57): max 3 -> 12 moved correct metal pixels by -2.26 points
                               #   (one dev view flipped, the other nine moved < 1 point); render time unchanged
  extra_passes:                # descriptive, not endpoints: name:kind:value (A-51, A-52, A-57)
    - "r02:metal:0.2"          # roughness dose-response
    - "r04:metal:0.4"
    - "bright:matte:0.5"       # bright matte
    - "nogloss:metal_noglossy:0.15"   # C3 material with reflections off, as in all renders before the fix

materials_matte:               # Lambertian (Principled: metallic 0, specular IOR level 0, roughness 1)
  plane_albedo: 0.5            # gate plane
  part_albedo: 0.25            # A-24 (rule revised by the user, 2026-11-04): mean exposed DN clipped at saturation of C4 part
                               #   pixels = that of C3 metal-part pixels, pooled over dev 1000-1004, at the auto-exposure gain.
                               #   Clipping couples this rule with the setpoint rule, so both are iterated to their common
                               #   solution: 0.32 at 10 DN -> 20 DN -> 0.247 -> 20 DN (65 degrees); at 71 degrees, from 20 DN and 0.247: rule 0.2499,
                               #   render at 0.25, rule 0.2498, setpoint still 20 DN, so converged (A-66). Plain mean matching breaks once
                               #   reflections are on (glints give 1.90); 0.085 was the plain-mean value at glossy 0
  tray_albedo: 0.3
  table_albedo: 0.4

materials_metal:               # C3 parts (A-11): Principled BSDF, metallic 1
  base_reflectance: 0.868      # aluminium normal-incidence reflectance at 848 nm from n, k of Rakic et al. 1998 (LD fit,
                               #   refractiveindex.info); 0.915 at 550 nm (the M2 RGB placeholder used 0.91)
  roughness: 0.15              # MERL "aluminium" GGX fit alpha 0.016-0.022 -> sqrt = 0.13-0.15 (S-16); user option (a)
                               #   2026-11-04; robustness 0.2 / 0.4 pre-declared (A-11)
  diffuse_albedo: 0.015        # Lambertian lobe of the same S-16 GGX + Lambertian fit (image-driven D = 0.013-0.017).
                               #   Without it 87% of metal-part pixels had zero radiance (dev 1000-1004, M4 step 2)

sensor_noise:                  # A-12 (user-approved model, 2026-11-04): shot + read noise in DN, shared draws C3/C4
  extra_blur_px: 0.0           # none beyond Blender's 1.5 px Blackman-Harris pixel filter
  read_noise_dn: 1.0
  e_per_dn: 0.42               # calibrated on anchor (a) at setpoint 20 DN, fx 897.25 px: median over z of the central-ROI plane-fit
                               #   RMS = 0.09 +- 0.001 px [S-13] (grid: 0.354 -> 0.0929, 0.42 -> 0.0897, 0.5 -> 0.0871; no noise 0.0749).
                               #   0.087 at 65 degrees, where the no-noise floor was 0.053 px: the floor depends on pixel locking at these
                               #   six distances, so the value moves a lot with f (A-12). EFFECTIVE value: it lumps all unmodelled
                               #   error sources (speckle, calibration), not a physical conversion gain

exposure:                      # linear radiance -> 8-bit DN (OpenCV SGBM accepts only 8-bit, A-40)
  mode: auto                   # A-42: per-frame gain on the C3 left image, shared by C4 and right ("fixed" = M3 behaviour)
  setpoint_dn: 20              # mean DN over columns >= ceil(f B / Min-Z); ledger rule: highest 10 DN step with <= 0.1%
                               #   saturated C4 pixels in every dev frame (30 DN: 0.41%); dots cover ~3% of pixels.
                               #   10 DN before reflections were on (A-57)
  gain: 5700.9                 # DN per unit radiance; M3 rule: p99.9 = 230 DN at 0.45 m (230 / 0.040344, 71 degrees); used only by the gate without noise
  calib_target_dn: 230         # gain chosen so the 99.9th-percentile pixel of the albedo-0.5 plane at
  calib_z_m: 0.45              #   Min-Z (0.45 m) is 230 DN: no saturation on matte at any valid range

sgbm:                          # OpenCV StereoSGBM (5.0.0) in .venv, D13. "strict" = M3 default (§5.8)
  block_size: 7
  p1_per_px: 8                 # P1 = p1_per_px * block_size^2 (grey input, 1 channel)
  p2_per_px: 32                # P2 = p2_per_px * block_size^2
  num_disparities: 128         # configs/default.yaml camera.sgbm_num_disparities; d > 126 masked (A-25)
  min_disparity: 0
  uniqueness_ratio: 10
  disp12_max_diff: 1           # left-right check on
  speckle_window_size: 100
  speckle_range: 2             # x16 internally
  pre_filter_cap: 63
  mode: SGBM                   # SGBM (5 paths) | HH (8 paths) | SGBM_3WAY

plane_gate:                    # gate on the matte plane at 71 degrees, fixed before any 71-degree render (A-67; A-38 is the 65-degree history)
  gate_z_m: [0.50, 0.60, 0.70, 0.80, 0.90, 1.00]
  minz_z_m: [0.37, 0.38, 0.39, 0.40, 0.41, 0.45, 0.46]   # true disparity 133.4, 129.9, 126.5, 123.4, 120.4, 109.7, 107.3 px
  roi_frac: 0.8                # central 80% of width and height (datasheet Rev 017 p. 91 "within 80% of this FOV"; our reading)
  bias_max: 0.01               # (i) |mean(z_est - z)| / z
  valid_min: 0.95              # (ii') valid share of the ROI
  band_tol: 0.10               # (iv') first valid column, relative tolerance
  band_z_m: [0.40, 0.41, 0.45, 0.46, 0.50]               # the band exceeds the lit edge: within tolerance of f B / z
  lit_z_m: [0.60, 0.70, 0.80, 0.90, 1.00]                # the lit edge exceeds the band: between (1 - tol) f B / z and (1 + tol) max(f B / z, lit edge)
  minz_valid_z_m: [0.40, 0.41, 0.45, 0.46]               # (iii') at least minz_valid_min valid
  minz_invalid_z_m: [0.37, 0.38]                         # (iii') at most minz_invalid_max valid; 0.39 m is reported only
  minz_valid_min: 0.95
  minz_invalid_max: 0.05       # above it: the marginal failure of option 3a, recorded under "what did not work"
  minz_invalid_stop: 0.10      # above it: stop and ask the user

rgb_render:                    # RGB only; neither task reads RGB; deleted before the IR passes, asserted at render time (A-69)
  light_energy: 12.0           # area light, W; A-69 rule on the 10 dev views: first passing energy, median 0%, maximum 2.66% saturated
                               #   part pixels, median part grey 180 (energy 150: 46%, 65%, 248); checked by eye
  world_fill: 0.05             # RGB world background

ambient_test:                  # descriptive ambient-IR test, seeds 0-9 (A-70). Level and spectrum are not sourced
  world_strength: 1.0          # uniform world in the ambient-only passes; projector off
  target_dn: 21.0              # mean over dev views of the median left-image DN on C3 part pixels (ROBI Zigzag 21.27)
  tol_dn: 0.5
  level: null                  # a in total = projector + a x ambient; set by scripts/ambient_level.py before any test seed
